      <p>
        每個人心裡皆有一個忘懷不了的故事，是這些故事使我們猶記初衷。
        青春，是我們年少時必經的課題，也紀錄著那段意氣風發的時光，如此清晰且刻骨銘心。
        誰沒有過年少輕狂？曾有的張揚莽撞，是年輕氣盛時的不可一世，是年紀漸長後的促膝長談。
        此書描寫在年少時的美好幻想與心中渴望盡快成人的期待。我們都是從這片蒼白且荒蕪的歲月裡生根發芽的。
